name: Android Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest || gradle testDebugUnitTest || true

      # Updated to v4 to fix: "deprecated version of actions/upload-artifact: v3"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NabilSilence-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
