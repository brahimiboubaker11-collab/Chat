name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Debug APK
        run: |
          GRADLE_DIR=$(find . -maxdepth 3 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR"
            chmod +x gradlew 2>/dev/null || true
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug -x lint -x test --no-daemon
            else
              gradle assembleDebug -x lint -x test --no-daemon
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
